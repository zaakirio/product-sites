server_tokens off;
gzip on;
gzip_types text/css image/svg+xml application/javascript text/plain;

map $host $site_root {
    hostnames;
    foundry.zaakir.io  /srv/sites/foundry;
    anvil.zaakir.io    /srv/sites/anvil;
    quench.zaakir.io   /srv/sites/quench;
    assay.zaakir.io    /srv/sites/assay;
    bellows.zaakir.io  /srv/sites/bellows;
    ingot.zaakir.io    /srv/sites/ingot;
    crucible.zaakir.io /srv/sites/crucible;
    flux.zaakir.io     /srv/sites/flux;
    vellichor.ikarza.com /srv/sites/vellichor;
    default            "";
}

server {
    listen 80 default_server;
    server_name _;

    # Directory index redirects (e.g. /privacy -> /privacy/) must stay relative:
    # this listens on plain 80 behind Caddy, so an absolute Location would send
    # the browser to http:// and downgrade the scheme.
    absolute_redirect off;

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        if ($site_root = "") {
            return 404;
        }
        root $site_root;
        index index.html;
        # $uri/index.html before $uri/ so /privacy serves the page in place
        # rather than redirecting to /privacy/; the canonical URL is the one
        # the App Store listing links, so it should not bounce.
        try_files $uri $uri/index.html $uri/ =404;
    }

    location ~* \.(svg|png|jpg|webp|css|js|woff2?)$ {
        if ($site_root = "") {
            return 404;
        }
        root $site_root;
        expires 7d;
        add_header Cache-Control "public";
    }
}
